version: '3'
services:
  website:
    image: robinvdgriend/binnenvisser:latest
    build: .
    ports:
      - 127.0.0.1:8011:80

  cache:
    container_name: binnenvisser_cache
    image: redis:6
    networks:
      - directus

  cms:
    image: directus/directus:10.5
    ports:
      - 8010:8055
    volumes:
      # By default, uploads are stored in /directus/uploads
      # Always make sure your volumes matches the storage root when using
      # local driver
      - ./uploads:/directus/uploads
      # Make sure to also mount the volume when using SQLite
      # - ./database:/directus/database
      # If you want to load extensions from the host
      # - ./extensions:/directus/extensions
    networks:
      - directus
    depends_on:
      - cache
    environment:
      KEY: '5df5b2d0-f508-4e00-9101-ac7ef1c5fa09'
      SECRET: 'b87e2233-cbbd-48f4-a922-09d6bd27547b'

      DB_CLIENT: 'pg'
      DB_CONNECTION_STRING: 'postgresql://binnenvisser:${DB_PASSWORD}@db-autechre-do-user-6290931-0.b.db.ondigitalocean.com:25060/binnenvisser?sslmode=no-verify'

      CORS_ENABLED: 'true'
      CORS_ORIGIN: 'true'
      
      CACHE_ENABLED: 'true'
      CACHE_AUTO_PURGE: 'true'
      CACHE_STORE: 'redis'
      REDIS: 'redis://cache:6379'

      ROOT_REDIRECT: '/cms/admin'
      # Make sure to set this in production
      # (see https://docs.directus.io/self-hosted/config-options#general)
      PUBLIC_URL: 'https://photek.robinvdgriend.nl/cms'

networks:
  directus:
