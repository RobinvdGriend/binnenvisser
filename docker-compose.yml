version: '3'
services:
  database:
    container_name: database
    image: postgis/postgis:13-master
    # Required when running on platform other than amd64, like Apple M1/M2:
    # platform: linux/amd64
    ports:
      - "5432:5432"
    volumes:
      - ./data/database:/var/lib/postgresql/data
    networks:
      - directus
    environment:
      POSTGRES_USER: 'binnenvisser'
      POSTGRES_PASSWORD: 'changeinproduction'
      POSTGRES_DB: 'binnenvisser'

  cache:
    container_name: cache
    image: redis:6
    networks:
      - directus

  cms:
    container_name: binnenvisser_cms
    image: directus/directus:latest
    ports:
      - 8055:8055
    volumes:
      # By default, uploads are stored in /directus/uploads
      # Always make sure your volumes matches the storage root when using
      # local driver
      - ./uploads:/directus/uploads
      # Make sure to also mount the volume when using SQLite
      # - ./database:/directus/database
      # If you want to load extensions from the host
      # - ./extensions:/directus/extensions
    networks:
      - directus
    depends_on:
      - cache
      - database
    environment:
      KEY: '5df5b2d0-f508-4e00-9101-ac7ef1c5fa09'
      SECRET: 'b87e2233-cbbd-48f4-a922-09d6bd27547b'

      DB_CLIENT: 'pg'
      DB_HOST: 'database'
      DB_PORT: '5432'
      DB_DATABASE: 'binnenvisser'
      DB_USER: 'binnenvisser'
      DB_PASSWORD: 'changeinproduction'

      CACHE_ENABLED: 'true'
      CACHE_STORE: 'redis'
      CACHE_REDIS: 'redis://cache:6379'

      ADMIN_EMAIL: 'robinvandegriend@gmail.com'
      ADMIN_PASSWORD: 'admin'

      # Make sure to set this in production
      # (see https://docs.directus.io/self-hosted/config-options#general)
      # PUBLIC_URL: 'https://directus.example.com'

networks:
  directus: