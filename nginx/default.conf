server {
  listen 80 default_server;
  listen [::]:80 default_server;

  root /usr/share/nginx/html;

  server_name _;

  add_header Cache-Control "public";
  gzip on;

  location / {
    expires 1h;
    try_files $uri $uri/ /index.html =404;
  }

  location ~* \.(jpg|webp|ico|png|woff2)$ {
    expires 1M;
  }
}